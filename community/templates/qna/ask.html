{% extends "base.html" %}
{% block title %}질문하기 · 모두의국비{% endblock %}

{% block content %}
<div class="head">
  <div>
    <div class="crumb">
      <a href="{% url 'qna_list' %}">Q&amp;A</a> · 질문 작성
    </div>
    <h1>질문하기</h1>
  </div>

  <a class="btn quiet" href="{% url 'qna_list' %}">목록으로</a>
</div>

<div class="panel">
  {% if error %}
    <div class="note" style="color: red;">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}

    <div class="field">
      <label for="id_title">제목</label>
      <input
        id="id_title"
        type="text"
        name="title"
        maxlength="250"
        value="{{ title|default:'' }}"
        placeholder="질문 제목을 입력하세요"
      >
    </div>

    <div class="field">
      <label for="id_content">내용</label>
      <textarea
        id="id_content"
        name="content"
        rows="12"
        placeholder="질문 내용을 입력하세요"
      >{{ content|default:'' }}</textarea>
    </div>

    <div class="row">
      <a class="btn quiet" href="{% url 'qna_list' %}">취소</a>
      <button class="btn" type="submit">등록</button>
    </div>
  </form>
</div>
{% endblock %}
