{% extends "base.html" %}
{% block title %}질문하기 · 모두의국비{% endblock %}

{% block content %}

<style>
  .qna-ask-panel {
    padding: 24px;
  }

  .qna-ask-panel .field {
    margin-top: 18px;
  }

  .qna-ask-panel .field:first-of-type {
    margin-top: 0;
  }

  .qna-ask-panel .control {
    width: 100%;
    box-sizing: border-box;
  }

  .qna-ask-panel input.control {
    padding: 12px 14px;
  }

  .qna-ask-panel textarea.control {
    padding: 12px 14px;
    resize: vertical;
  }

  .qna-ask-panel .row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 24px;
  }

  .qna-warning {
    display: none;

    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    z-index: 10000;

    color: red;
    font-size: 16px;
    font-weight: 600;

    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;

    padding: 14px 20px;

    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
  }
</style>


<div class="head">
  <div>
    <div class="crumb">
      <a href="{% url 'qna_list' %}">Q&amp;A</a> · 질문 작성
    </div>

    <h1>질문하기</h1>
  </div>

  <a class="btn quiet" href="{% url 'qna_list' %}">
    목록으로
  </a>
</div>


<div id="qna-warning" class="qna-warning">
  제목과 내용을 입력해주세요.
</div>


<div class="panel qna-ask-panel">

  <form method="post" id="qna-ask-form">
    {% csrf_token %}


    <div class="field">
      <label for="id_title">제목</label>

      <input
        id="id_title"
        class="control"
        type="text"
        name="title"
        maxlength="250"
        value="{{ title|default:'' }}"
        placeholder="질문 제목을 입력하세요"
      >
    </div>


    <div class="field">
      <label for="id_content">내용</label>

      <textarea
        id="id_content"
        class="control"
        name="content"
        rows="12"
        placeholder="질문 내용을 입력하세요"
      >{{ content|default:'' }}</textarea>
    </div>


    <div class="row">

      <a
        class="btn quiet"
        href="{% url 'qna_list' %}"
      >
        취소
      </a>

      <button
        class="btn"
        type="submit"
      >
        등록
      </button>

    </div>

  </form>

</div>


<script>
  const qnaForm = document.getElementById("qna-ask-form");
  const titleInput = document.getElementById("id_title");
  const contentInput = document.getElementById("id_content");
  const warning = document.getElementById("qna-warning");

  let warningTimer;

  qnaForm.addEventListener("submit", function(event) {

    const title = titleInput.value.trim();
    const content = contentInput.value.trim();

    if (!title || !content) {

      event.preventDefault();

      warning.style.display = "block";

      clearTimeout(warningTimer);

      warningTimer = setTimeout(function() {
        warning.style.display = "none";
      }, 2000);
    }

  });
</script>

{% endblock %}
